<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Only the app's own files. ws://localhost is Vite's live reload during development. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:5173; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>UOM Converter</title>
    <meta name="description" content="Conversions for the electrical industry, for suppliers, distributors, counter staff, electricians, engineers and product data teams in the US, Canada and Europe." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- The app frame: title bar and audience bar stay put; the sidebar and the converter scroll on their own. -->
    <header class="titlebar">
      <h1 class="brand"><img src="./icon.svg" alt="" width="18" height="18" />UOM Converter</h1>
      <button type="button" id="find" class="find" aria-keyshortcuts="Control+K">
        <span>Find a converter…</span><kbd>Ctrl K</kbd>
      </button>
      <div class="region">
        <span class="label" id="region-label">Region</span>
        <div id="region" class="seg" role="group" aria-labelledby="region-label"></div>
      </div>
    </header>
    <div class="audience">
      <span class="label" id="audience-label">Show converters for</span>
      <div id="audience" class="tabs" role="group" aria-labelledby="audience-label"></div>
      <p id="audience-desc" class="audience-desc"></p>
    </div>
    <label class="picker">
      <span class="label">Converter</span>
      <select id="picker"></select>
    </label>
    <div class="layout">
      <nav id="sidebar" aria-label="Converters"></nav>
      <main id="content"></main>
    </div>
    <dialog id="switcher" aria-label="Find a converter">
      <input id="switcher-input" type="text" autocomplete="off" placeholder="Type a converter name, like voltage drop or AWG" role="combobox" aria-controls="switcher-list" aria-expanded="true" />
      <ul id="switcher-list" role="listbox"></ul>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
