<!doctype html>
<!-- Google Play's phone and tablet screenshots: render.cjs loads this page at 360 × 640 (rendered at 3×, so
     1080 × 1920) once per language, shot and device, named by the hash (#de.home, #fr.vdrop, …) and ?device= (phone,
     tablet7, tablet10; ?width= is that device's screen width in CSS pixels, ?status= its status bar's height). A phone shot is the brand across the top,
     the need it meets as the headline, and the real app below it on the device, cut off by the bottom edge. A tablet
     shot is the app alone, filling the image: Google asks tablet screenshots to leave out text that isn't part of the
     app, since Play can crop it. Both show a capture of the built page (build/shots/<language>/<device>/<name>.png) that
     render.cjs takes first, from each shot's settings below. The words are in captions.js. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../../../packages/brand/store.css" />
    <style>
      html, body { width: 360px; height: 640px; }
      /* Darker across the top, under the headline; the pylon and the sunset show around the phone. */
      body { --shade: linear-gradient(180deg, rgba(10, 6, 4, 0.6) 0%, rgba(10, 6, 4, 0.3) 35%, transparent 60%); --focus: 22% 60%; --blur: 3px; }
      /* The grid fades out behind the phone. */
      body::after { background-size: 20px 20px; mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.5) 25%, transparent 45%); }

      .brand { position: absolute; left: 26px; top: 26px; display: flex; align-items: center; gap: 9px; }
      .brand img { width: 30px; height: 30px; filter: drop-shadow(0 5px 9px rgba(8, 10, 60, 0.45)); }
      .brand span { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }

      h1 {
        position: absolute;
        left: 26px;
        right: 26px;
        top: 72px;
        margin: 0;
        font-size: 29px;
        line-height: 1.08;
        font-weight: 760;
        letter-spacing: -0.03em;
        font-variation-settings: "opsz" 32;
      }
      h1 em { font-style: normal; color: var(--bolt); }
      .text { position: absolute; left: 26px; right: 26px; top: 146px; margin: 0; font-size: 13.5px; line-height: 1.4; font-weight: 450; color: rgba(255, 255, 255, 0.86); }

      /* The phone: the capture (393 CSS px wide, at 3×) shown 262 px wide in a slim black bezel with round corners,
         run off the bottom edge. A status bar is drawn over the page's top inset, as Android draws its own. */
      .phone {
        position: absolute;
        left: 50%;
        top: 214px;
        width: 278px;
        transform: translateX(-50%);
        padding: 8px 8px 0;
        border-radius: 34px 34px 0 0;
        background: #0d0f12;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.18),
          0 26px 60px rgba(5, 8, 50, 0.6),
          0 8px 20px rgba(5, 8, 50, 0.38);
      }
      .screen { position: relative; overflow: hidden; border-radius: 26px 26px 0 0; }
      .screen > img { display: block; width: 262px; }
      .tablet .brand, .tablet h1, .tablet .text { display: none; }
      .tablet .phone { inset: 0; width: 360px; transform: none; padding: 0; border-radius: 0; box-shadow: none; background: none; }
      .tablet .screen { border-radius: 0; }
      .tablet .screen > img { width: 360px; }
      /* Android's status bar as Google's system bars guide draws it, sized in dp at the scale the capture is shown (--dp),
         in the app's text colour (--text in @uom/brand/tokens.css). Wi-Fi, signal and battery full, as Google asks. */
      .status {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: var(--status);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 calc(16 * var(--dp));
        font-size: calc(14 * var(--dp));
        font-weight: 400;
        color: #222831;
      }
      .status i { display: flex; align-items: center; gap: calc(1 * var(--dp)); }
      .status svg { display: block; width: calc(16 * var(--dp)); height: calc(16 * var(--dp)); fill: currentColor; }
      /* The punch-hole camera, in the middle of the status bar. Tablets keep theirs in the bezel. */
      .status::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(24 * var(--dp));
        height: calc(24 * var(--dp));
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #0d0f12;
      }
      .tablet .status::after { display: none; }
    </style>
  </head>
  <body>
    <div class="brand"><img src="../../../../packages/brand/app-icon.svg" alt="" /><span>UOM Converter</span></div>
    <h1 id="title"></h1>
    <p class="text" id="text"></p>
    <div class="phone"><div class="screen" id="screen"></div></div>

    <script src="captions.js"></script>
    <script>
      // Each shot, in upload order: the app as it opens: `region` and `audience` as if picked in its settings and role
      // filter, `recent` as if those converters were opened last, and `hash` the screen (none: the home screen; #<id>:
      // that converter, on its first worked example). `scrollTo` scrolls that part of the converter to the top on a
      // phone, so its answer shows above the crop; a tablet shows the converter from its top. The words are in
      // captions.js, under the same name.
      const SHOTS = {
        home: { region: "us", audience: "electrician", recent: ["vdrop", "awg", "price"], hash: "" },
        vdrop: { region: "us", audience: "electrician", hash: "#vdrop", scrollTo: ".to" },
        "price-units": { region: "us", audience: "distributor", hash: "#price" },
        awg: { region: "ca", audience: "electrician", hash: "#awg", scrollTo: ".to" },
        "uom-codes": { region: "eu", audience: "pim", hash: "#uom-codes" },
      };

      // Material's Wi-Fi, signal and battery icons (Apache 2.0), on a 24 × 24 grid, in the order Android shows them.
      const STATUS_ICONS = [
        "M12.01 21.49L23.64 7c-.45-.34-4.93-4-11.64-4C5.28 3 .81 6.66.36 7l11.63 14.49.01.01.01-.01z",
        "M2 22h20V2z",
        "M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z",
      ].map((d) => `<svg viewBox="0 0 24 24"><path d="${d}" /></svg>`).join("");

      const [language, name] = location.hash.slice(1).split(".");
      if (name) {
        const words = CAPTIONS[language]?.shots[name];
        if (!words) throw new Error("Unknown shot " + location.hash);
        const params = new URLSearchParams(location.search);
        const device = params.get("device") ?? "phone";
        const tablet = device.startsWith("tablet");
        document.documentElement.lang = language;
        document.body.classList.toggle("tablet", tablet);
        // One dp on the device, at the size its capture is shown, and the status bar's height.
        const dp = (tablet ? 360 : 262) / Number(params.get("width") ?? 393);
        document.body.style.setProperty("--dp", `${dp}px`);
        document.body.style.setProperty("--status", `${Number(params.get("status") ?? 40) * dp}px`);
        document.getElementById("title").innerHTML = words.title;
        document.getElementById("text").textContent = words.text;
        document.getElementById("screen").innerHTML =
          `<img src="../../build/shots/${language}/${device}/${name}.png" alt="" />` + `<div class="status"><span>12:30</span><i>${STATUS_ICONS}</i></div>`;
      }
    </script>
  </body>
</html>
