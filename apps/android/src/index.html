<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Edge to edge: the page draws under the status and navigation bars and pads itself (style.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Only the app's own files. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>UOM Converter</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Two screens, one shown at a time: the list of converters, and one converter. -->
    <section id="home" class="screen" aria-labelledby="home-title">
      <!-- The app bar, search and roles: one block, held at the top while the cards scroll. -->
      <div class="home-head">
        <header class="appbar">
          <h1 id="home-title" class="appbar-title">UOM Converter</h1>
          <button id="open-settings" class="icon-button" type="button" data-t-aria-label="Settings" aria-haspopup="dialog"></button>
        </header>
        <label class="search">
          <span class="sr" data-t>Search converters</span>
          <input id="q" type="search" data-t-placeholder="Search converters" autocomplete="off" spellcheck="false" enterkeyhint="search" />
        </label>
        <div id="roles" class="roles" role="group" data-t-aria-label="Show converters for"></div>
      </div>
      <div class="home-body">
        <nav id="list" class="list" data-t-aria-label="Converters"></nav>
      </div>
    </section>

    <section id="screen" class="screen" hidden>
      <header class="appbar">
        <button id="back" class="icon-button" type="button" data-t-aria-label="Back"></button>
        <h1 id="screen-title" class="appbar-title"></h1>
      </header>
      <main id="content" class="screen-body"></main>
      <!-- Behind the converter: its topic's photo, at the foot of the screen. -->
      <div id="backdrop" class="backdrop" aria-hidden="true"></div>
    </section>

    <dialog id="settings" class="sheet" aria-labelledby="settings-title">
      <h2 id="settings-title" data-t>Settings</h2>
      <fieldset class="choices">
        <legend data-t>Language</legend>
        <div id="languages"></div>
      </fieldset>
      <fieldset class="choices">
        <legend data-t>Region</legend>
        <div id="regions"></div>
      </fieldset>
      <p class="sheet-hint" data-t>Sets units, number formats, voltages and the wiring code converters refer to.</p>
      <nav class="sheet-links" data-t-aria-label="About">
        <a href="https://uom-converter.com/" rel="noopener" data-t>Website</a>
        <a href="https://github.com/chengmarc/uom-converter/blob/main/PRIVACY.md" rel="noopener" data-t>Privacy</a>
        <a href="https://github.com/chengmarc/uom-converter/issues" rel="noopener" data-t>Report a problem</a>
      </nav>
      <p id="version" class="sheet-version"></p>
      <button id="close-settings" class="button" type="button" data-t>Done</button>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
