<!doctype html>
<!-- Google Play's phone and tablet screenshots: render.cjs loads this page at 360 × 640 (rendered at 3×, so
     1080 × 1920) once per shot and device, named by the hash (#home, #vdrop, …) and ?device= (phone, tablet-7,
     tablet-10; ?width= is that device's screen width in CSS pixels). Each is the brand across the top, the need it
     meets as the headline, and the real app below it on the device, cut off by the bottom edge: a capture of the
     built page (build/shots/<device>/<name>.png) that render.cjs takes first, from each shot's settings below. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../../../packages/brand/store.css" />
    <style>
      html, body { width: 360px; height: 640px; }
      /* Darker across the top, under the headline; the pylon and the sunset show around the phone. */
      body { --shade: linear-gradient(180deg, rgba(10, 6, 4, 0.6) 0%, rgba(10, 6, 4, 0.3) 35%, transparent 60%); --focus: 22% 60%; --blur: 3px; }
      /* The grid fades out behind the phone. */
      body::after { background-size: 20px 20px; mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.5) 25%, transparent 45%); }

      .brand { position: absolute; left: 26px; top: 26px; display: flex; align-items: center; gap: 9px; }
      .brand img { width: 30px; height: 30px; filter: drop-shadow(0 5px 9px rgba(8, 10, 60, 0.45)); }
      .brand span { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }

      h1 {
        position: absolute;
        left: 26px;
        right: 26px;
        top: 72px;
        margin: 0;
        font-size: 29px;
        line-height: 1.08;
        font-weight: 760;
        letter-spacing: -0.03em;
        font-variation-settings: "opsz" 32;
      }
      h1 em { font-style: normal; color: var(--bolt); }
      .text { position: absolute; left: 26px; right: 26px; top: 146px; margin: 0; font-size: 13.5px; line-height: 1.4; font-weight: 450; color: rgba(255, 255, 255, 0.86); }

      /* The phone: the capture (393 CSS px wide, at 3×) shown 262 px wide in a slim black bezel with round corners,
         run off the bottom edge. A tablet is wider, with squarer corners. A status bar is drawn over the page's top
         inset (24 CSS px on the device, scaled as the capture is), as Android draws its own. */
      .phone {
        position: absolute;
        left: 50%;
        top: 214px;
        width: 278px;
        transform: translateX(-50%);
        padding: 8px 8px 0;
        border-radius: 34px 34px 0 0;
        background: #0d0f12;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.18),
          0 26px 60px rgba(5, 8, 50, 0.6),
          0 8px 20px rgba(5, 8, 50, 0.38);
      }
      .screen { position: relative; overflow: hidden; border-radius: 26px 26px 0 0; }
      .screen > img { display: block; width: 262px; }
      .tablet .phone { width: 318px; padding: 9px 9px 0; border-radius: 22px 22px 0 0; }
      .tablet .screen { border-radius: 13px 13px 0 0; }
      .tablet .screen > img { width: 300px; }
      .status { position: absolute; left: 0; right: 0; top: 0; height: var(--status, 16px); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 9.5px; font-weight: 600; color: #1c1b19; }
      .status i { display: flex; gap: 4px; }
      .status b { width: 13px; height: 7px; border-radius: 2px; background: currentColor; }
      .status b:first-child { width: 9px; border-radius: 1px 1px 2px 2px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
    </style>
  </head>
  <body>
    <div class="brand"><img src="../../../../packages/brand/app-icon.svg" alt="" /><span>UOM Converter</span></div>
    <h1 id="title"></h1>
    <p class="text" id="text"></p>
    <div class="phone"><div class="screen" id="screen"></div></div>

    <script>
      // Each shot, in upload order: the need it meets in the customer's words (the last phrase in the bolt colour),
      // how the app meets it, and the app as it opens: `region` and `audience` as if picked in its settings and
      // role filter, `recent` as if those converters were opened last, and `hash` the screen (none: the home
      // screen; #<id>: that converter, on its first worked example). `scroll` scrolls a converter so its answer
      // shows above the crop.
      const SHOTS = {
        home: {
          title: "Every number on the job, <em>converted.</em>",
          text: "Wire sizes, voltage drop, prices and unit codes, with the ones you use first.",
          region: "us",
          audience: "electrician",
          recent: ["vdrop", "awg", "price"],
          hash: "",
        },
        vdrop: {
          title: "Will that wire carry the run? <em>Know first.</em>",
          text: "See the drop, and the smallest wire that keeps it within your target.",
          region: "us",
          audience: "electrician",
          hash: "#vdrop",
          scroll: 700,
        },
        "price-units": {
          title: "Per C, per M, <em>per each.</em>",
          text: "Turn prices per 100 and per 1,000 into the price of one, and back.",
          region: "us",
          audience: "distributor",
          hash: "#price",
        },
        awg: {
          title: "AWG to mm², <em>and back.</em>",
          text: "North American wire sizes to metric, with the nearest and next larger size.",
          region: "ca",
          audience: "electrician",
          hash: "#awg",
          scroll: 132,
        },
        "uom-codes": {
          title: "Clean units in every <em>supplier file.</em>",
          text: "Turn EA, ft, box or lbs into the UN/ECE codes BMEcat, ETIM and e-invoicing expect.",
          region: "eu",
          audience: "pim",
          hash: "#uom-codes",
        },
      };

      const name = location.hash.slice(1);
      if (name) {
        const shot = SHOTS[name];
        if (!shot) throw new Error("Unknown shot " + location.hash);
        const params = new URLSearchParams(location.search);
        const device = params.get("device") ?? "phone";
        const tablet = device.startsWith("tablet");
        document.body.classList.toggle("tablet", tablet);
        // The status bar's 24 CSS px on the device, at the size its capture is shown.
        document.body.style.setProperty("--status", `${(24 * (tablet ? 300 : 262)) / Number(params.get("width") ?? 393)}px`);
        document.getElementById("title").innerHTML = shot.title;
        document.getElementById("text").textContent = shot.text;
        document.getElementById("screen").innerHTML =
          `<img src="../../build/shots/${device}/${name}.png" alt="" />` + `<div class="status"><span>12:30</span><i><b></b><b></b></i></div>`;
      }
    </script>
  </body>
</html>
