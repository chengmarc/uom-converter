<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Only the app's own files. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <title>UOM Converter</title>
    <meta name="description" content="Conversions for the electrical industry, for suppliers, distributors, counter staff, estimators, electricians, inspectors, engineers and product data teams in the US, Canada and Europe." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- The app frame: title bar and audience bar stay put; the sidebar and the converter scroll on their own. -->
    <header class="titlebar">
      <h1 class="brand"><img src="/app-icon.svg" alt="" width="18" height="18" />UOM Converter</h1>
    </header>
    <!-- Who you are: the choice that sets which converters show. -->
    <div class="audience">
      <span class="label" id="audience-label" data-t>Show converters for</span>
      <div id="audience" class="tabs" role="group" aria-labelledby="audience-label"></div>
      <button id="open-settings" class="settings-button" type="button" aria-haspopup="dialog"><span data-t>Settings</span></button>
      <p id="audience-desc" class="audience-desc"></p>
    </div>
    <label class="picker">
      <span class="label" data-t>Converter</span>
      <select id="picker"></select>
    </label>
    <div class="layout">
      <!-- Heads the converter list it searches, and stays put while the list scrolls. -->
      <label class="find">
        <span class="label" data-t>Find a converter</span>
        <input id="find" type="search" data-t-placeholder="Find a converter" autocomplete="off" spellcheck="false" aria-controls="sidebar" aria-keyshortcuts="Control+F" />
        <kbd>Ctrl F</kbd>
      </label>
      <nav id="sidebar" data-t-aria-label="Converters"></nav>
      <!-- Behind the converter: the pane's background, with its topic's photo at the foot. -->
      <div id="backdrop" class="backdrop" aria-hidden="true"></div>
      <main id="content"></main>
    </div>
    <dialog id="settings" class="settings" aria-labelledby="settings-title">
      <h2 id="settings-title" data-t>Settings</h2>
      <label class="setting">
        <span class="label" data-t>Language</span>
        <select id="language"></select>
      </label>
      <div class="setting">
        <span class="label" id="theme-label" data-t>Theme</span>
        <div id="theme" class="seg" role="group" aria-labelledby="theme-label"></div>
      </div>
      <div class="setting">
        <span class="label" id="region-label" data-t>Region</span>
        <div id="region" class="seg" role="group" aria-labelledby="region-label"></div>
      </div>
      <p class="settings-hint" data-t>Sets units, number formats, voltages and the wiring code converters refer to.</p>
      <button id="close-settings" class="settings-done" type="button" data-t>Done</button>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
