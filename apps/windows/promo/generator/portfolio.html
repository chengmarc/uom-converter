<!doctype html>
<!-- A portfolio tile for a job profile (Boss 直聘, 猎聘, 脉脉): render.cjs loads this page at 1080 x 1080 into
     apps/windows/promo/out/portfolio.png. It's mostly seen as a thumbnail about 1.5 cm wide, four to a row, so both apps fill the square
     and only the name, at the top, has to read at that size; the tag under it is for when the tile is opened.
     The same layout on every repo's tile, so they read as a set, and like the others it has no photos: 猎聘 turned it
     down as 敏感 with the Store images' pylon behind it and the substation on the phone, and passed it without them.
     So the backdrop is a plain navy under store.css's grid, the window is the promo shot captured with the app's
     photos hidden (promo-nophoto.png, by render.cjs) and the phone the Android app's home screen, likewise
     (home-nophoto.png, by its render.cjs): run `npm run android:store` first, then `npm run windows:assets`. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../packages/brand/store.css">
<style>
  html, body { width: 1080px; height: 1080px; }
  /* Navy, lighter behind the name, in place of store.css's photo; dots in place of its grid, as on AlphaVerify's tile. */
  body::before { background: radial-gradient(120% 90% at 20% 0%, #1d2f7a 0%, #0c1238 55%, #070a1f 100%); filter: none; }
  body::after { background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px); background-size: 24px 24px; }

  /* The label: icon and name in the top-left corner. */
  .label { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: center; gap: 30px; padding: 52px 56px 0; }
  .label img { width: 156px; height: 156px; flex: none; filter: drop-shadow(0 8px 16px rgba(8, 10, 60, 0.5)); }
  .label b { display: block; width: max-content; white-space: nowrap; font-size: 124px; line-height: 0.95; font-weight: 760; letter-spacing: -0.03em; }
  .label small { display: block; margin-top: 14px; font: 600 40px "Segoe UI Variable Text", "Segoe UI", sans-serif; color: rgba(255, 255, 255, 0.85); }
  .label small em { font-style: normal; color: var(--bolt); }

  /* The window (1400 wide, as in shots.html), bleeding off the right and the bottom, and the phone in front. */
  .window {
    position: absolute; left: 40px; top: 290px; width: 1400px; transform: scale(0.8); transform-origin: top left;
    border-radius: 18px; overflow: hidden; backdrop-filter: blur(30px) saturate(1.3);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.22), 0 48px 120px rgba(5, 8, 50, 0.6), 0 14px 36px rgba(5, 8, 50, 0.38);
  }
  .window > img { display: block; width: 1400px; }
  .phone {
    position: absolute; left: 700px; top: 420px; padding: 9px; border-radius: 40px; background: #0d0f12;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18), 0 30px 70px rgba(5, 8, 50, 0.65), 0 10px 24px rgba(5, 8, 50, 0.4);
  }
  .phone img { display: block; width: 300px; border-radius: 32px; }
</style>
</head>
<body>
  <div class="window"><img src="../../build/shots/en/promo-nophoto.png" alt=""></div>
  <div class="phone"><img src="../../../android/build/shots/en/phone/home-nophoto.png" alt=""></div>
  <div class="label">
    <img src="../../../../packages/brand/app-icon.svg" alt="">
    <span><b>UOM Converter</b><small>For the <em>electrical</em> trade · Windows + Android</small></span>
  </div>
<script>
  // The name and the tag shrink, if they must, to fit beside the icon.
  const room = 1080 - 2 * 56 - 156 - 30;
  for (const el of document.querySelectorAll(".label b, .label small")) {
    const size = parseFloat(getComputedStyle(el).fontSize), width = el.scrollWidth;
    el.style.width = "max-content"; el.style.whiteSpace = "nowrap";
    const w = el.getBoundingClientRect().width;
    if (w > room) el.style.fontSize = size * room / w + "px";
  }
  // Laid out at 1080 CSS pixels, then scaled to the window: render.cjs draws it in a 540 px window at 2x, since
  // Windows won't open one taller than the screen's work area.
  document.documentElement.style.zoom = innerWidth / 1080;
</script>
</body>
</html>
