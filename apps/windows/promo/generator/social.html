<!doctype html>
<!-- GitHub's social preview, the card shown when the repo's link is shared: render.cjs loads this page at 1280 × 640 into
     apps/windows/promo/out/social-preview.png, which is uploaded in the repo's Settings. GitHub crops a little off the edges in places,
     so the words and badges stay 40px clear of them; the window runs off the right, so the card has no empty margin. It shows both apps: the Windows window is the promo shot's capture, and
     the phone is the Android app's home screen, captured by `npm run android:store`. The words are in captions.js. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../../../packages/brand/store.css" />
    <style>
      html, body { width: 1280px; height: 640px; }
      /* Darker on the left, under the name; the pylon and the sunset show around the app. */
      body { --shade: linear-gradient(90deg, rgba(10, 6, 4, 0.66) 0%, rgba(10, 6, 4, 0.42) 40%, transparent 72%); --focus: 50% 65%; }
      /* The grid fades out behind the app. */
      body::after { mask-image: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, 0.5) 34%, transparent 52%); }

      .caption { position: absolute; left: 56px; top: 0; bottom: 0; width: 400px; display: flex; flex-direction: column; justify-content: center; }
      /* The icon only: .caption img would also size the badges. */
      .caption > img { width: 104px; height: 104px; margin-left: -3px; filter: drop-shadow(0 8px 16px rgba(8, 10, 60, 0.5)); }
      h1 { margin: 22px 0 0; font-size: 56px; line-height: 1; font-weight: 760; letter-spacing: -0.03em; font-variation-settings: "opsz" 32; }
      .caption p { margin: 12px 0 0; font-size: 28px; font-weight: 520; color: rgba(255, 255, 255, 0.85); }
      .caption p em { font-style: normal; color: var(--bolt); }
      .caption .platforms { margin-top: 8px; font-size: 23px; font-weight: 600; color: #fff; }

      /* The README's badges, in its order, under the platforms. */
      .badges { display: flex; gap: 8px; margin-top: 32px; align-items: center; }
      .badges img { display: block; height: 41px; }

      /* The app window, as in shots.html: 1400 × 860 at 0.64, off the right, with Windows 11's corners and a deep shadow. */
      .window {
        position: absolute;
        left: 490px;
        top: 56px;
        width: 1400px;
        transform: scale(0.64);
        transform-origin: top left;
        border-radius: 18px;
        overflow: hidden;
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.22),
          0 48px 120px rgba(5, 8, 50, 0.6),
          0 14px 36px rgba(5, 8, 50, 0.38);
      }
      /* Acrylic: the app's frame is see-through (its `desktop` style), and Windows blurs what's behind the window. */
      .window { backdrop-filter: blur(30px) saturate(1.3); }
      .window > img { display: block; width: 1400px; }
      /* The minimize, maximize and close buttons Windows draws over the page's own title bar. */
      .caption-buttons { position: absolute; top: 0; right: 0; display: flex; color: #1c1b19; }
      .caption-buttons i { width: 46px; height: 40px; display: grid; place-items: center; font: normal 10px "Segoe Fluent Icons", "Segoe MDL2 Assets"; }

      /* The phone, in the Play screenshots' slim black bezel (the Android app's shots.html), in front of the window's
         right edge, low enough to leave its answer clear, and off the bottom. */
      .phone {
        position: absolute;
        left: 1036px;
        top: 312px;
        padding: 7px;
        border-radius: 31px;
        background: #0d0f12;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.18),
          0 30px 70px rgba(5, 8, 50, 0.65),
          0 10px 24px rgba(5, 8, 50, 0.4);
      }
      .phone img { display: block; width: 214px; border-radius: 26px; }
    </style>
  </head>
  <body>
    <div class="caption">
      <img src="../../../../packages/brand/app-icon.svg" alt="" />
      <h1>UOM Converter</h1>
      <p id="tagline"></p>
      <p class="platforms">Windows · Android</p>
      <div class="badges"><img src="../../../../docs/badges/badge-download.svg" alt=""><img src="../../../../docs/badges/badge-microsoft-store.svg" alt=""><img src="../../../../docs/badges/badge-google-play.svg" alt=""></div>
    </div>
    <div class="window">
      <img src="../../build/shots/en/promo.png" alt="" />
      <div class="caption-buttons"><i>&#xE921;</i><i>&#xE922;</i><i>&#xE8BB;</i></div>
    </div>
    <div class="phone"><img src="../../../android/build/shots/en/phone/home.png" alt="" /></div>

    <script src="captions.js"></script>
    <script>
      document.getElementById("tagline").innerHTML = CAPTIONS.en.tagline;
    </script>
  </body>
</html>
