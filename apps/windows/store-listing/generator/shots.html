<!doctype html>
<!-- The Store's screenshots: render.cjs loads this page at 1366 × 768 (rendered at 2×) once per language and shot,
     named by the hash (#de.promo, #fr.voltage-drop, …). Each is the brand and facts across the top, the need it meets as
     the headline, and the real app below it, cropped by the bottom edge: a capture of the built page
     (build/shots/<language>/<name>.png) that render.cjs takes first, from each shot's `query` and `theme` below. The
     words are in captions.js. Colours come from the icon's tile and bolt. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../../../packages/brand/store.css" />
    <style>
      html, body { width: 1366px; height: 768px; }
      /* The grid fades out behind the app. */
      /* Darker across the top, under the headline; the pylon and the sunset show around the app. */
      body { --shade: linear-gradient(180deg, rgba(10, 6, 4, 0.6) 0%, rgba(10, 6, 4, 0.35) 30%, transparent 60%); --focus: 50% 65%; }

      /* The grid fades out behind the app. */
      body::after { mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.5) 30%, transparent 55%); }
      .top { position: absolute; left: 72px; right: 72px; top: 34px; display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 13px; }
      .brand img { width: 46px; height: 46px; filter: drop-shadow(0 8px 14px rgba(8, 10, 60, 0.45)); }
      .brand span { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
      .brand small { display: block; margin-top: 1px; font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, 0.72); }
      .brand small em { font-style: normal; }

      .facts { display: flex; gap: 8px; }
      .facts span {
        padding: 6px 13px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 560;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.22);
      }

      h1 {
        position: absolute;
        left: 72px;
        top: 106px;
        margin: 0;
        font-size: 40px;
        line-height: 1;
        font-weight: 760;
        letter-spacing: -0.03em;
        font-variation-settings: "opsz" 32;
      }
      h1 em { font-style: normal; color: var(--bolt); }
      .text { position: absolute; left: 72px; top: 158px; margin: 0; font-size: 17px; font-weight: 450; color: rgba(255, 255, 255, 0.85); }

      /* The app window at the size it opens at (1400 × 860, main.cjs MIN_SIZE), scaled down and run off the bottom edge.
         Windows 11's 9 px corners, a hairline border and a deep shadow. */
      .window {
        position: absolute;
        left: 50%;
        top: 204px;
        width: 1400px;
        transform: translateX(-50%) scale(0.8);
        transform-origin: top center;
        border-radius: 11px 11px 0 0;
        overflow: hidden;
        box-shadow:
          0 0 0 1.25px rgba(255, 255, 255, 0.22),
          0 36px 90px rgba(5, 8, 50, 0.6),
          0 10px 26px rgba(5, 8, 50, 0.38);
      }
      /* Acrylic: the app's frame is see-through (its `desktop` style), and Windows blurs what's behind the window. */
      .window { backdrop-filter: blur(30px) saturate(1.3); }
      .window > img { display: block; width: 1400px; }
      /* The minimize, maximize and close buttons Windows draws over the page's own title bar. */
      .caption-buttons { position: absolute; top: 0; right: 0; display: flex; color: #1c1b19; }
      .caption-buttons.dark { color: #edebe6; }
      .caption-buttons i { width: 46px; height: 40px; display: grid; place-items: center; font: normal 10px "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="brand"><img src="../../../../packages/brand/app-icon.svg" alt="" /><span>UOM Converter<small id="tagline"></small></span></div>
      <div class="facts" id="facts"></div>
    </div>
    <h1 id="title"></h1>
    <p class="text" id="text"></p>
    <div class="window" id="window"></div>

    <script src="captions.js"></script>
    <script>
      // Each shot, in upload order: the app as it opens on `query` (role, region and converter; each converter opens on
      // its first worked example) in `theme`. `scrollTo` scrolls that part of the converter to the top, so its answer is above the crop. Its words,
      // the need it meets in the customer's words and how the app meets it, are in captions.js, under the same name.
      const SHOTS = {
        promo: { query: "?for=electrician&region=us#awg", theme: "light" },
        "voltage-drop": { query: "?for=electrician&region=us#vdrop", theme: "light", scrollTo: ".examples" },
        "price-units": { query: "?for=distributor&region=us#price", theme: "light" },
        "kva-amps": { query: "?for=engineer&region=eu#load", theme: "light" },
        reels: { query: "?for=counter&region=ca#reels", theme: "light" },
        "uom-codes": { query: "?for=pim&region=eu#uom-codes", theme: "light" },
      };

      const [language, name] = location.hash.slice(1).split(".");
      if (name) {
        const shot = SHOTS[name];
        const words = CAPTIONS[language];
        if (!shot || !words) throw new Error("Unknown shot " + location.hash);
        document.documentElement.lang = language;
        document.getElementById("tagline").innerHTML = words.tagline;
        // The first is the converter count, which render.cjs fills in from @uom/converters.
        document.getElementById("facts").innerHTML = words.facts.map((f, i) => `<span${i ? "" : ' id="count"'}>${f}</span>`).join("");
        document.getElementById("title").innerHTML = words.shots[name].title;
        document.getElementById("text").textContent = words.shots[name].text;
        document.getElementById("window").innerHTML =
          `<img src="../../build/shots/${language}/${name}.png" alt="" />` +
          `<div class="caption-buttons ${shot.theme}"><i>&#xE921;</i><i>&#xE922;</i><i>&#xE8BB;</i></div>`;
      }
    </script>
  </body>
</html>
