<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Only the site's own files. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <title>UOM Converter</title>
    <meta name="description" content="Conversions for the electrical industry, for suppliers, distributors, counter staff, electricians, engineers and product data teams in the US, Canada and Europe." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <!-- One header on every page: the name, the region and the Windows app, then the categories. -->
    <header class="site-header">
      <div class="wrap header-row">
        <a class="brand" href="/" data-home><img src="/app-icon.svg" alt="" width="24" height="24" />UOM Converter</a>
        <div class="header-tools">
          <label class="region"><span>Region</span><select id="region"></select></label>
          <a class="get-app" id="get-app" rel="noopener">Windows app</a>
        </div>
      </div>
      <nav class="category-nav" aria-label="Categories">
        <ul class="wrap" id="category-nav"></ul>
      </nav>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <div class="wrap footer-grid">
        <div class="footer-brand">
          <a class="brand" href="/" data-home><img src="/app-icon.svg" alt="" width="24" height="24" />UOM Converter</a>
          <p>Free unit conversions for the electrical trade. Everything is worked out in your browser.</p>
        </div>
        <nav aria-labelledby="footer-topics">
          <h2 id="footer-topics">Converters</h2>
          <ul id="footer-topic-list"></ul>
        </nav>
        <nav aria-labelledby="footer-project">
          <h2 id="footer-project">Project</h2>
          <ul>
            <li><a id="footer-app">Windows app</a></li>
            <li><a href="https://github.com/chengmarc/uom-converter/blob/main/docs/PRIVACY.md" rel="noopener">Privacy</a></li>
            <li><a href="https://github.com/chengmarc/uom-converter" rel="noopener">Source code</a></li>
            <li><a href="https://github.com/chengmarc/uom-converter/issues" rel="noopener">Report a problem</a></li>
          </ul>
        </nav>
      </div>
      <div class="footer-legal">
        <div class="wrap">
          <span>© <span id="footer-year"></span> UOM Converter</span>
          <a href="https://github.com/chengmarc/uom-converter/blob/main/docs/PRIVACY.md" rel="noopener">Privacy</a>
        </div>
      </div>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
