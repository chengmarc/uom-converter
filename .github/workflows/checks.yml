# Runs the tests, the typecheck and the website build on every push and pull request.
# Deploying the website is Cloudflare's job (apps/web/wrangler.jsonc), not this workflow's.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Nothing here needs Electron's binary.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:web
