<!doctype html>
<!-- The Store's first screenshot: rendered by render.cjs at 1366 × 768, 2×, after the real
     screenshots, since it shows one of them. Colours come from the icon's tile and bolt. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      html, body { width: 1366px; height: 768px; }
      /* The grid fades out behind the app. */
      body::before { mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.5) 35%, transparent 60%); }

      /* One strip across the top: brand and facts, then the headline. The app gets the rest. */
      .top { position: absolute; left: 88px; right: 88px; top: 48px; display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 14px; }
      .brand img { width: 52px; height: 52px; filter: drop-shadow(0 8px 14px rgba(8, 10, 60, 0.45)); }
      .brand span { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }

      .facts { display: flex; gap: 8px; }
      .facts span {
        padding: 7px 13px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 560;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.22);
      }

      h1 {
        position: absolute;
        left: 88px;
        top: 128px;
        margin: 0;
        font-size: 44px;
        line-height: 1;
        font-weight: 760;
        letter-spacing: -0.03em;
        font-variation-settings: "opsz" 32;
      }
      h1 em { font-style: normal; color: var(--bolt); }

      /* The app at 87%, running off the bottom edge below its answer. */
      .shot {
        position: absolute;
        left: 88px;
        right: 88px;
        top: 232px;
        border-radius: 14px 14px 0 0;
        overflow: hidden;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.18),
          0 30px 70px rgba(5, 8, 50, 0.55),
          0 8px 20px rgba(5, 8, 50, 0.35);
      }
      .shot img { display: block; width: 100%; }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="brand"><img src="../src/web/app-icon.svg" alt="" /><span>UOM Converter</span></div>
      <div class="facts">
        <span id="count">Every converter</span>
        <span>US · Canada · Europe</span>
        <span>Works offline</span>
      </div>
    </div>
    <h1>Every number on the job, <em>converted.</em></h1>
    <div class="shot"><img src="listing/screenshot-2-awg.png" alt="" /></div>
  </body>
</html>
