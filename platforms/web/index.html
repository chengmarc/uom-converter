<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Only the site's own files. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="../../src/brand/app-icon.svg" type="image/svg+xml" />
    <title>UOM Converter</title>
    <meta name="description" content="Conversions for the electrical industry, for suppliers, distributors, counter staff, electricians, engineers and product data teams in the US, Canada and Europe." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <!-- One header on every page: home, search, region, and the Windows app. -->
    <header class="site-header">
      <div class="wrap header-row">
        <a class="brand" href="/" data-home><img src="../../src/brand/app-icon.svg" alt="" width="24" height="24" />UOM Converter</a>
        <div class="search" role="search">
          <label class="sr" for="q">Search converters</label>
          <input
            id="q"
            type="search"
            placeholder="Search converters"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-expanded="false"
            aria-controls="q-results"
            aria-autocomplete="list"
            aria-keyshortcuts="/ Control+K"
          />
          <kbd aria-hidden="true">/</kbd>
          <ul id="q-results" class="search-results" role="listbox" aria-label="Converters" hidden></ul>
        </div>
        <div class="region" role="group" aria-label="Region" id="region"></div>
        <a class="button get-app" id="get-app" rel="noopener">Get the Windows app</a>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <div class="wrap footer-grid">
        <div class="footer-brand">
          <a class="brand" href="/" data-home><img src="../../src/brand/app-icon.svg" alt="" width="24" height="24" />UOM Converter</a>
          <p>Free unit conversions for the electrical trade. Everything is worked out in your browser.</p>
        </div>
        <nav aria-labelledby="footer-topics">
          <h2 id="footer-topics">Converters</h2>
          <ul id="footer-topic-list"></ul>
        </nav>
        <nav aria-labelledby="footer-project">
          <h2 id="footer-project">Project</h2>
          <ul>
            <li><a id="footer-app">Windows app</a></li>
            <li><a href="https://github.com/chengmarc/uom-converter/blob/main/PRIVACY.md" rel="noopener">Privacy</a></li>
            <li><a href="https://github.com/chengmarc/uom-converter" rel="noopener">Source code</a></li>
            <li><a href="https://github.com/chengmarc/uom-converter/issues" rel="noopener">Report a problem</a></li>
          </ul>
        </nav>
      </div>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
